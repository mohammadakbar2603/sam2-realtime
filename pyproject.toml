[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2-stream"
version = "0.1.0"
description = "Bounded-memory real-time streaming for SAM 2: live camera and long/high-res videos, without loading the whole thing into memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["sam2", "segment-anything", "video-segmentation", "tracking", "real-time", "streaming"]
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
]

# Note: torch and the `sam2` package are prerequisites you install separately.
# See the README for the install steps (SAM 2 comes from facebookresearch/sam2).

[tool.setuptools.packages.find]
include = ["sam2_stream*"]
